networks:
  apps:
    external: true

services:
  toonflow-app:
    build:
      context: .
      dockerfile: infra/Dockerfile.multi-stage
    image: toonflow-app
    container_name: toonflow-app
    environment:
      - NODE_ENV=dev
      - PORT=10588
      - TZ=${TZ}
      - DB_TYPE=pg
      - PG_HOST=postgresql
      - PG_PORT=5432
      - PG_DATABASE=toonflow
      - PG_USER=user_toonflow
      - PG_PASSWORD=2430@163.com
      - AI_DEBUG=1
      - SQL_DEBUG=0
    healthcheck:
      interval: 30s
      retries: 3
      test: [ "CMD-SHELL", "wget -q -O - http://localhost:10588/health || exit 1" ]
      timeout: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.toonflow-app.rule=Host(`toonflow-app.952712.xyz`)"
      - "traefik.http.routers.toonflow-app.entrypoints=websecure"
      - "traefik.http.routers.toonflow-app.tls.certresolver=myresolver"
      - "traefik.http.routers.toonflow-app.tls.domains[0].main=toonflow-app.952712.xyz"
      - "traefik.http.services.toonflow-app.loadbalancer.server.port=10588"
      - "traefik.http.routers.toonflow-app.middlewares=secure-headers@file"
    networks:
      - apps
    ports:
      - "10588:10588"
    restart: unless-stopped
    volumes:
      - ./data/oss:/app/data/oss
      - ./data/assets:/app/data/assets
      - ./data/models:/app/data/models
      - ./data/skills:/app/data/skills
      - ./data/vendor:/app/data/vendor
      # data/web 不挂载，由 Dockerfile 构建阶段自动生成前端产物
      - ./logs:/app/logs
